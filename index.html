<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiba Thakur</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./index_files/css2" rel="stylesheet">
<style>
  :root{--ink:#14171C;--paper:#F7F8F6;--main:#2B3A67;--accent:#C9A227;}
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:var(--paper);color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .card{max-width:480px;text-align:center;}
  .badge{
    width:64px;height:64px;border-radius:50%;
    background:var(--main);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:22px;
    color:var(--paper);margin:0 auto 24px;
  }
  .badge span{color:var(--accent);}
  h1{font-family:'Fraunces',serif;font-size:32px;margin:0 0 12px;}
  p{font-size:15.5px;color:#555;margin:0 0 28px;line-height:1.6;}
  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--main);font-weight:600;
  }
  .status::before{
    content:"";width:7px;height:7px;border-radius:50%;
    background:var(--accent);display:inline-block;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">H<span>T</span></div>
    <h1>Hiba Thakur</h1>
    <p>I don't guess what works in search — I measure it, and I show my work.</p>
    <div class="status">Portfolio in progress</div>
  </div>


</body></html>
